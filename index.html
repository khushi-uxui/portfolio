<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Khushi Gautam — Portfolio</title>
    <style>
        *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

        html, body {
            width: 100%; height: 100%;
            overflow: hidden;
            background: #0d0d0d;
            font-family: sans-serif;
        }

        /* ── Steps ─────────────────────────────────────────── */
        .step {
            width: 1920px;
            height: 1080px;
            position: relative;
            overflow: hidden;
        }
        .step img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: block;
            pointer-events: none;
        }

        /* Fade inactive steps */
        .step { opacity: 0.2; transition: opacity 0.8s; }
        .step.active { opacity: 1; }

        /* Hide before init */
        .impress-not-supported .step { display: none; }

        /* ── Hotspot buttons on slide 5 ────────────────────── */
        .hotspot {
            position: absolute;
            display: block;
            border-radius: 50%;
            background: rgba(226, 30, 30, 0.05);
            border: 2px solid rgba(226, 30, 30, 0.25);
            cursor: pointer;
            z-index: 10;
            transition: background 0.3s, border-color 0.3s, box-shadow 0.3s, transform 0.3s;
        }
        .hotspot:hover {
            background: rgba(226, 30, 30, 0.15);
            border-color: rgba(226, 30, 30, 0.6);
            box-shadow: 0 0 24px rgba(226, 30, 30, 0.4);
            transform: scale(1.08);
        }

        /* ── Navigation buttons on branch slides ──────────── */
        .nav-bar {
            display: none;
        }
        .nav-btn {
            padding: 10px 24px;
            border: 2px solid rgba(0,0,0,0.3);
            border-radius: 30px;
            background: rgba(255,255,255,0.85);
            color: #222;
            font-size: 15px;
            font-weight: 600;
            cursor: pointer;
            transition: background 0.2s, border-color 0.2s, transform 0.2s;
            text-decoration: none;
            display: inline-block;
            pointer-events: auto;
            position: relative;
            z-index: 200;
        }
        .nav-btn:hover {
            background: #e41e1e;
            color: #fff;
            border-color: #e41e1e;
            transform: scale(1.05);
        }

        /* ── Slide dots (main path only) ──────────────────── */
        .slide-dots {
            position: fixed;
            bottom: 24px;
            left: 50%;
            transform: translateX(-50%);
            display: flex;
            gap: 8px;
            z-index: 1000;
            transition: opacity 0.4s;
        }
        .slide-dots.hidden { opacity: 0; pointer-events: none; }
        .slide-dots span {
            width: 10px; height: 10px;
            border-radius: 50%;
            background: rgba(255,255,255,0.35);
            transition: background 0.3s, transform 0.3s;
            cursor: pointer;
        }
        .slide-dots span.active {
            background: #e41e1e;
            transform: scale(1.4);
        }

        /* ── Contact link overlays ─────────────────────────── */
        .contact-link {
            position: absolute;
            z-index: 10;
            display: block;
            /* border: 2px solid rgba(226, 30, 30, 0.5); */
        }
    </style>
</head>
<body>

</div>

<!-- Dots: main path only -->
<div class="slide-dots" id="dots"></div>

<script src="impress.min.js"></script>
<script>
(function () {
    var api = impress();
    api.init();

    // ── All slides in order ───────────────────────────────
    var allIds = ['intro', 'brain', 'test-workflow', 'b2b-saas', 'process',
                  'discover', 'define', 'design', 'deliver',
                  'creative', 'ai-trust', 'team', 'contact'];

    // ── Build dots ────────────────────────────────────────
    var dotsContainer = document.getElementById('dots');
    var dots = [];
    allIds.forEach(function (id) {
        var dot = document.createElement('span');
        dot.addEventListener('click', function () { api.goto(id); });
        dotsContainer.appendChild(dot);
        dots.push({ el: dot, id: id });
    });

    function updateDots() {
        var active = document.querySelector('.step.active');
        var activeId = active ? active.id : '';
        dots.forEach(function (d) {
            d.el.className = (d.id === activeId) ? 'active' : '';
        });
    }
    document.addEventListener('impress:stepenter', updateDots);
    updateDots();

    // ── Scroll-wheel navigation ───────────────────────────
    var transitioning = false;
    var TRANSITION_DURATION = 1200;
    var TRANSITION_DELAY    = TRANSITION_DURATION / 2;
    var TRANSITION_TOTAL    = TRANSITION_DURATION + TRANSITION_DELAY;
    document.addEventListener('wheel', function (e) {
        e.preventDefault();
        if (transitioning) return;
        transitioning = true;
        if (e.deltaY > 0) api.next();
        else api.prev();
        setTimeout(function () { transitioning = false; }, TRANSITION_TOTAL);
    }, { passive: false });

    // ── Button navigation (data-goto) ─────────────────────
    var allGotos = document.querySelectorAll('[data-goto]');
    allGotos.forEach(function (btn) {
        btn.addEventListener('click', function (e) {
            e.preventDefault();
            e.stopPropagation();
            api.goto(btn.getAttribute('data-goto'));
        });
        btn.addEventListener('touchend', function (e) {
            e.preventDefault();
            e.stopPropagation();
            api.goto(btn.getAttribute('data-goto'));
        });
    });

})();
</script>
</body>
